[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# DB URL is read from DATABASE_URL (.env) by migrations/env.py.
# Keep this file ASCII-only: alembic reads it with the OS locale encoding (cp949 on Korean Windows).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
