# ─────────────────────────────────────────────────────────────
# 수집 소스 설정. 아래 기본값은 모두 무료이며 API 키 없이 동작한다.
# 각 소스가 지금 응답하는지는 `issue-stream doctor` 로 확인하고, 안 되는 것은 enabled: false 로 끈다.
# ─────────────────────────────────────────────────────────────

# 언론사 RSS (무료, 키 불필요). 실패하는 피드는 경고만 남기고 건너뛴다.
rss:
  # 한국경제: 해외 서버 IP(Railway 싱가포르)에서 403 Forbidden → 끔. 국내 PC 에서만 쓸 거면 true 로.
  - {name: 한국경제 증권, url: "https://www.hankyung.com/feed/finance", enabled: false}
  - {name: 한국경제 경제, url: "https://www.hankyung.com/feed/economy", enabled: false}
  - {name: 매일경제 증권, url: "https://www.mk.co.kr/rss/50200011/", enabled: true}
  - {name: 연합뉴스 경제, url: "https://www.yna.co.kr/rss/economy.xml", enabled: true}
  - {name: 파이낸셜뉴스 증권, url: "https://www.fnnews.com/rss/r20/fn_realnews_stock.xml", enabled: true}
  # doctor 로 확인 후 켜기
  - {name: 이데일리 증권, url: "https://rss.edaily.co.kr/stock_news.xml", enabled: false}
  - {name: 서울경제 증권, url: "https://www.sedaily.com/rss/finance", enabled: false}
  - {name: 이투데이 증권, url: "https://rss.etoday.co.kr/eto/market_news.xml", enabled: false}
  # 미국 시장 (영어 원문). region: us → 대시보드 '미국' 탭으로
  - {name: CNBC Markets, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258", enabled: true, region: us}
  - {name: Nasdaq.com Markets, url: "https://www.nasdaq.com/feed/rssoutbound?category=Markets", enabled: true, region: us}

# 구글 뉴스 RSS 검색 (무료, 키 불필요). 관심종목 이름 + 추가 키워드로 최근 기사 수집.
google_news:
  enabled: true
  per_ticker: true          # watchlist.yaml 의 종목명으로 검색
  window: 1d                # 최근 1일
  extra_queries: ["코스피", "코스닥 마감", "기준금리", "원달러 환율"]
  # 미국 시장: 한국어 보도 (구글 뉴스 한국판)
  us_queries: ["뉴욕증시", "나스닥 마감", "연준 금리", "미국 국채 금리"]
  # 미국 시장: 영어 원문 (구글 뉴스 미국판)
  en_queries: ["stock market today", "Wall Street stocks", "Federal Reserve rates", "Nasdaq S&P 500"]

# 야후 파이낸스 종목별 영어 헤드라인 (무료, 키 불필요). 누군가 ☆ 한 미국 종목마다 1회 요청
yahoo_finance:
  enabled: true
  max_tickers: 30

# 네이버 뉴스 검색 API (무료, 키 필요: NAVER_CLIENT_ID/SECRET)
naver_news:
  enabled: false
  extra_keywords: ["코스피", "코스닥", "금리", "환율"]
  display: 50

# 거시 지표 (무료, 키 필요)
ecos:
  enabled: false           # ECOS_API_KEY 입력 후 켜기
  series:
    - {code: "722Y001", item: "0101000", cycle: "D", name: "한국은행 기준금리"}
    - {code: "731Y001", item: "0000001", cycle: "D", name: "원/달러 환율(매매기준율)"}
fred:
  enabled: false           # FRED_API_KEY 입력 후 켜기
  series: ["DGS10", "FEDFUNDS", "CPIAUCSL"]

# 대시보드 상단 지수 스트립.
# sources 를 생략하면 기본 순서(네이버 → 야후 → FinanceDataReader)로 시도한다.
index_strip:
  - {symbol: "KS11", name: "코스피"}
  - {symbol: "KQ11", name: "코스닥"}
  - {symbol: "US500", name: "S&P 500"}
  - {symbol: "IXIC", name: "나스닥"}
  - {symbol: "USD/KRW", name: "원/달러"}

# 환율 화면. unit 은 표시 단위(엔화는 100엔당). sources 를 생략하면 collectors/quotes.py 의 기본 체인
# (원화 환율: 네이버 하나은행 고시 → 야후, 교차 환율·달러 인덱스: 야후). 평일 10분마다 갱신.
fx_rates:
  - {symbol: "USD/KRW", name: "미국 달러", currency: USD, unit: 1}
  - {symbol: "JPY/KRW", name: "일본 엔", currency: JPY, unit: 100}
  - {symbol: "EUR/KRW", name: "유로", currency: EUR, unit: 1}
  - {symbol: "CNY/KRW", name: "중국 위안", currency: CNY, unit: 1}
  - {symbol: "GBP/KRW", name: "영국 파운드", currency: GBP, unit: 1}
  - {symbol: "DXY", name: "달러 인덱스"}
  - {symbol: "EUR/USD", name: "유로/달러"}
  - {symbol: "USD/JPY", name: "달러/엔"}

# 업종 히트맵: 업종 ETF 의 전일 대비 등락률로 그린다 (KRX 업종 지수는 로그인이 필요해 대체).
# name 은 화면 표시 이름, code 는 ETF 종목코드. doctor 가 실제 ETF 이름을 보여주니 맞는지 확인할 것.
sector_etfs:
  - {name: 반도체, code: "091160"}        # KODEX 반도체
  - {name: 2차전지, code: "305540"}       # TIGER 2차전지테마
  - {name: 자동차, code: "091180"}        # KODEX 자동차
  - {name: 은행, code: "091170"}          # KODEX 은행
  - {name: 증권, code: "102970"}          # KODEX 증권
  - {name: 보험, code: "140700"}          # KODEX 보험
  - {name: 건설, code: "117700"}          # KODEX 건설
  - {name: 철강, code: "117680"}          # KODEX 철강
  - {name: 에너지화학, code: "117460"}    # KODEX 에너지화학
  - {name: 기계장비, code: "102960"}      # KODEX 기계장비
  - {name: 운송, code: "140710"}          # KODEX 운송
  - {name: 헬스케어, code: "266420"}      # KODEX 헬스케어
  - {name: 바이오, code: "244580"}        # KODEX 바이오
  - {name: 미디어·엔터, code: "266360"}   # KODEX 미디어&엔터테인먼트
  - {name: 게임, code: "300950"}          # KODEX 게임산업
  - {name: IT, code: "266370"}            # KODEX IT

# 미국 업종 히트맵: 미국 업종 ETF (S&P 500 섹터 SPDR + 반도체·바이오). code 는 네이버 해외주식 조회 코드
# (NYSE Arca 상장 ETF 는 대개 접미사 없음, 나스닥 상장은 .O). issue-stream doctor 로 응답 확인.
us_sector_etfs:
  - {name: 기술, code: "XLK"}
  - {name: 반도체, code: "SOXX.O"}
  - {name: 커뮤니케이션, code: "XLC"}
  - {name: 임의소비재, code: "XLY"}
  - {name: 금융, code: "XLF"}
  - {name: 헬스케어, code: "XLV"}
  - {name: 바이오, code: "IBB.O"}
  - {name: 산업재, code: "XLI"}
  - {name: 에너지, code: "XLE"}
  - {name: 필수소비재, code: "XLP"}
  - {name: 소재, code: "XLB"}
  - {name: 유틸리티, code: "XLU"}
  - {name: 부동산, code: "XLRE.K"}
