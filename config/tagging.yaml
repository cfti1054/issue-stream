# 종목 태깅 설정 (pipeline/tagging.py)
#
# exclude_names: 일반명사·지명·인명과 같아 기사 문장에 흔히 나오는 종목명.
#   여기 넣은 이름으로는 태깅하지 않는다 ("지원 대상" → 대상(001680) 오탐 방지).
#   공시처럼 소스가 종목코드를 직접 준 기사는 그대로 태깅된다.
#   이름을 고친 뒤에는 `issue-stream retag --days 7` 로 최근 기사 태그를 다시 계산한다.
exclude_names:
  # 한글 일반명사·지명
  - 대상
  - 동방
  - 동양
  - 동서
  - 나노
  - 남성
  - 노을
  - 대원
  - 레몬
  - 레이
  - 배럴
  - 서산
  - 서원
  - 선진
  - 신흥
  - 우성
  - 진도
  - 진영
  - 코디
  - 태양
  - 전방
  - 화신
  - 핑거
  - 피노
  - 카스
  - 캐리
  - 하스
  - 러셀
  - 삼일
  - 상보
  - 유신
  - 율촌
  - 보령
  - 일승
  - 성우
  - 백산
  - 오공
  - 하츠
  - 야스
  # 영문 약어 (국내 종목은 대문자 그대로일 때만 태깅하지만, 기사에서 다른 뜻으로 흔히 쓰이는 것)
  - TP        # 목표주가(Target Price)
  - CS        # 고객서비스, Credit Suisse
  - KD
